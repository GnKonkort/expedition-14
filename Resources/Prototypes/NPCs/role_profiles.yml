# Thin role profiles for the NPC editor (no inventory/chem policies).

- type: npcRoleProfile
  id: SyndicateFootsoldier
  canDefib: false
  canBypassDoor: true
  tasks:
  - BypassDoor

- type: npcRoleProfile
  id: StationMedic
  canDefib: true
  canBypassDoor: false
