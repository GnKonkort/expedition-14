# Tries to shoot a target at range: seek cover → hold 6–10 tiles → legacy adjacent juke.
# Barricades: walk to the rear stand and shoot. Climb only if MoveTo rubs stuck on the cade.
- type: htnCompound
  id: SeekCoverCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickCoverOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: CoverMovementRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
            holdCover: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: HoldRangeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickHoldRangeOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MovementRangeClose

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: LegacyGunJukeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: RangedEngageCompound
  branches:
    # Soft cover first when available (PickCover fails closed → next branch).
    - tasks:
        - !type:HTNCompoundTask
          task: SeekCoverCompound
    - tasks:
        - !type:HTNCompoundTask
          task: HoldRangeCompound
    # No cover / hold point: close to LOS and shoot.
    - tasks:
        - !type:HTNCompoundTask
          task: DirectGunEngageCompound
    - tasks:
        - !type:HTNCompoundTask
          task: LegacyGunJukeCompound

# Move into LOS at ranged range, then keep shooting.
- type: htnCompound
  id: DirectGunEngageCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: RangedRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

# Tries to shoot a target at range.
- type: htnCompound
  id: GunCombatCompound
  branches:
    # Draw stowed gun, pick target, then engage (cover → hold range → juke).
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:OwnedGunPrecondition
            - !type:HeldGunPrecondition
              invert: true
          operator: !type:DrawOwnedGunOperator

        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNCompoundTask
          task: RangedEngageCompound

    # Already holding the gun — same fight loop without a draw step.
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:HeldGunPrecondition
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNCompoundTask
          task: RangedEngageCompound

# Selects a gun in range, then moves to it and picks it up.
- type: htnCompound
  id: PickupGunCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGuns

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandFreePrecondition
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target

# Shorted version of RangedCombatCompound for entities that are guns themselves.
- type: htnCompound
  id: InnateRangedCombatCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound


# Combat-first ranged AI: fight, illusion-reload when empty (no ammo loot/stock).
- type: htnCompound
  id: RangedCombatCompound
  branches:
    # Fight when gun has ammo (highest priority)
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NearbyHostilesPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # Empty gun: illusion reload (auto-refill + SFX), no inventory loot
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:NearbyHostilesPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadHeldGunOperator

    # Opportunistic grenade after guns
    - preconditions:
        - !type:NearbyHostilesPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNCompoundTask
          task: GrenadeCombatCompound

    # Fight under melee pressure
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NearbyHostilesPrecondition
          rangeKey: MeleeRange
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # No owned gun → pick one up if nearby
    - preconditions:
        - !type:OwnedGunPrecondition
          invert: true
      tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound

    # Peace: holster when empty and safe
    - preconditions:
        - !type:HeldGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:NearbyHostilesPrecondition
          invert: true
          rangeKey: MeleeRange
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:StowPeaceEquipmentOperator

# After PeaceStowDelaySeconds without hostiles: holster gun.
- type: htnCompound
  id: PeaceStowCompound
  branches:
    - preconditions:
        - !type:PeaceStowReadyPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:StowPeaceEquipmentOperator
