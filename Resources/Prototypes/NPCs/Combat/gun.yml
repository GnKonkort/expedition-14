# Tries to shoot a target at range: seek cover → hold 6–10 tiles → legacy adjacent juke.
# Barricades: rear tile → climb onto cade center. From FACE: climb over first, then rear → cade.
- type: htnCompound
  id: SeekCoverCompound
  branches:
    # From the attack face: climb/path over to rear, then onto cade center.
    - preconditions:
        - !type:OnDirectionalCoverFacePrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickCoverOperator

        - !type:HTNPrimitiveTask
          operator: !type:SetBoolOperator
            targetKey: NavClimb
            value: true

        # Vault immediately when already adjacent to the cade.
        - !type:HTNPrimitiveTask
          operator: !type:ClimbCoverOperator

        - !type:HTNPrimitiveTask
          operator: !type:SetCoverRearTargetOperator

        - !type:HTNPrimitiveTask
          applyEffectsOnStartup: false
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: CoverMovementRange

        - !type:HTNPrimitiveTask
          operator: !type:SetCoverStandTargetOperator

        - !type:HTNPrimitiveTask
          applyEffectsOnStartup: false
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: CoverMovementRange

        - !type:HTNPrimitiveTask
          operator: !type:SetBoolOperator
            targetKey: NavClimb
            value: false

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
            holdCover: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

    # Default: walk to rear tile, then climb onto cade center (tables: approach == stand).
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickCoverOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: CoverMovementRange

        - !type:HTNPrimitiveTask
          operator: !type:SetBoolOperator
            targetKey: NavClimb
            value: true

        - !type:HTNPrimitiveTask
          operator: !type:SetCoverStandTargetOperator

        - !type:HTNPrimitiveTask
          applyEffectsOnStartup: false
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: CoverMovementRange

        - !type:HTNPrimitiveTask
          operator: !type:SetBoolOperator
            targetKey: NavClimb
            value: false

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
            holdCover: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: HoldRangeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickHoldRangeOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MovementRangeClose

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: LegacyGunJukeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

- type: htnCompound
  id: RangedEngageCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: SeekCoverCompound
    - tasks:
        - !type:HTNCompoundTask
          task: HoldRangeCompound
    - tasks:
        - !type:HTNCompoundTask
          task: LegacyGunJukeCompound

# Tries to shoot a target at range.
- type: htnCompound
  id: GunCombatCompound
  branches:
    # Draw stowed gun, pick target, then engage (cover → hold range → juke).
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:OwnedGunPrecondition
            - !type:HeldGunPrecondition
              invert: true
          operator: !type:DrawOwnedGunOperator

        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNCompoundTask
          task: RangedEngageCompound

    # Already holding the gun — same fight loop without a draw step.
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:HeldGunPrecondition
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNCompoundTask
          task: RangedEngageCompound

# Selects compatible ammo in range, then moves to it and picks it up (reload is attempted in the pickup Update).
- type: htnCompound
  id: PickupAmmoCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickupCompatibleAmmoOperator
            pickup: false

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:PickupCompatibleAmmoOperator
            pickup: true

# Loot a nearby bag/belt (sampled ≤10) for compatible ammo (reload attempted in loot Update).
- type: htnCompound
  id: LootNearbyAmmoStorageCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:LootNearbyAmmoStorageOperator
            takeItem: false

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:LootNearbyAmmoStorageOperator
            takeItem: true

# One inventory fill step for incomplete mags (seated or spare).
- type: htnCompound
  id: FillCompatibleMagazinesCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:FillMagazineOperator

# Stock up to combat minimum: discard empty boxes / drained disposable cells, fill mags, top off tubes, loot floor ammo.
- type: htnCompound
  id: StockAmmoCompound
  branches:
    - preconditions:
        - !type:HasEmptyCompatibleAmmoBoxPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:DiscardEmptyAmmoBoxOperator

    - preconditions:
        - !type:InventoryHasMagazineFillMaterialPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: FillCompatibleMagazinesCompound

    - preconditions:
        - !type:NeedsBallisticTubeFillPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadHeldGunOperator

    - preconditions:
        - !type:NearbyMatchingAmmoPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: PickupAmmoCompound

# Reload held gun from inventory (insert first, then fill incomplete mags).
- type: htnCompound
  id: SelfReloadCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadHeldGunOperator

    - tasks:
        - !type:HTNCompoundTask
          task: FillCompatibleMagazinesCompound

# Selects a gun in range, then moves to it and picks it up.
- type: htnCompound
  id: PickupGunCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGuns

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandFreePrecondition
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target

# Shorted version of RangedCombatCompound for entities that are guns themselves.
- type: htnCompound
  id: InnateRangedCombatCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound


- type: htnCompound
  id: RangedCombatCompound
  branches:
    # 1. Insert spare mag when slot empty/spent (even if chamber still has a round)
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:AmmoSearchReadyPrecondition
        - !type:NeedsMagazineInsertPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadHeldGunOperator

    # 1b. Insert / upgrade power cell for energy guns
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:AmmoSearchReadyPrecondition
        - !type:NeedsPowerCellInsertPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadHeldGunOperator

    # 1c. Empty external-charge energy gun with no portable recharger → discard
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:ShouldDiscardEnergyGunPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:DiscardUnusableEnergyGunOperator

    # 1d. Empty energy gun: holster/dock for recharge, then fall through to melee / other tasks
    #     (do NOT idle-wait — NeedsEnergyChargeWait only blocks ranged use until full)
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:NeedsStowEnergyGunForChargePrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:StowEnergyGunForChargeOperator

    # 2. Fight when stocked (draw happens inside GunCombatCompound)
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedsEnergyChargeWaitPrecondition
          invert: true
        - !type:NeedsAmmoStockPrecondition
          invert: true
        - !type:NearbyHostilesPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # 3. Fight under melee pressure even if still stocking
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedsEnergyChargeWaitPrecondition
          invert: true
        - !type:NearbyHostilesPrecondition
          rangeKey: MeleeRange
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # 4. Stock ammo to minimum before seeking a fight
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:AmmoSearchReadyPrecondition
        - !type:NeedsAmmoStockPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: StockAmmoCompound

    # 5. Self-reload from inventory when empty
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:AmmoSearchReadyPrecondition
        - !type:InventoryHasReloadMaterialPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: SelfReloadCompound

    # 6. Pickup gun with ammo if we have no owned gun on body
    - preconditions:
        - !type:OwnedGunPrecondition
          invert: true
      tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound

    # 7. Empty gun + matching ammo on floor
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:AmmoSearchReadyPrecondition
        - !type:NearbyMatchingAmmoPrecondition
      tasks:
        - !type:HTNCompoundTask
          task: PickupAmmoCompound

    # 8. Empty gun + matching ammo in nearby bags
    - preconditions:
        - !type:OwnedGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:AmmoSearchReadyPrecondition
        - !type:NearbyAmmoStoragePrecondition
      tasks:
        - !type:HTNCompoundTask
          task: LootNearbyAmmoStorageCompound

    # 9. Empty gun + alternate loadout nearby → drop and switch
    - preconditions:
        - !type:HeldGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:AmmoSearchReadyPrecondition
        - !type:NearbyAlternateLoadoutPrecondition
        - !type:NearbyMatchingAmmoPrecondition
          invert: true
        - !type:AmmoLogisticsPotentialPrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator
        - !type:HTNCompoundTask
          task: PickupGunCompound

    # 10. Empty gun + nothing useful → holster (never discard onto the floor)
    - preconditions:
        - !type:HeldGunPrecondition
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:NearbyHostilesPrecondition
          invert: true
          rangeKey: MeleeRange
        - !type:NearbyMatchingAmmoPrecondition
          invert: true
        - !type:AmmoLogisticsPotentialPrecondition
          invert: true
        - !type:ShouldDiscardEnergyGunPrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:StowPeaceEquipmentOperator

# After PeaceStowDelaySeconds without hostiles: holster gun, stow held ammo,
# and for power-cell guns restore self-recharging cells / discard disposable spares.
- type: htnCompound
  id: PeaceStowCompound
  branches:
    - preconditions:
        - !type:PeaceStowReadyPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:StowPeaceEquipmentOperator
