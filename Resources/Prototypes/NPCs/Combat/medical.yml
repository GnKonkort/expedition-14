# Medic = owns a defibrillator.
# Corpse: heal 10 damage per visible DoAfter until soft-revive ready, then defib.
# Living allies: heal 10 per DoAfter when TotalDamage > 10.

- type: htnCompound
  id: WaitDefibDoAfterCompound
  branches:
    - preconditions:
        - !type:ActiveDefibDoAfterPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WaitDefibDoAfterOperator

- type: htnCompound
  id: WaitHealDoAfterCompound
  branches:
    - preconditions:
        - !type:ActiveIllusionHealDoAfterPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WaitIllusionHealDoAfterOperator
    - preconditions:
        - !type:ActiveHealDoAfterPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WaitHealDoAfterOperator

# Prefer owned defib from bag; no floor loot.
- type: htnCompound
  id: ObtainDefibCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:SelectDefibOperator
            ownedOnly: true

# Heal corpse in 10-damage steps (visible progress bar) before zap.
- type: htnCompound
  id: HealCorpseCompound
  branches:
    - preconditions:
        - !type:OwnedDefibPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickCorpseHealTargetOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:IllusionHealOperator
            corpsePrep: true
            duration: 2
            sound: !type:SoundPathSpecifier
              path: /Audio/Items/Medical/brutepack_begin.ogg

- type: htnCompound
  id: DefibAllyCompound
  branches:
    - preconditions:
        - !type:OwnedDefibPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickRevivableCorpseOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:CanDefibAllyPrecondition
          operator: !type:SelectDefibOperator
            ownedOnly: true

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:UseDefibOperator

# Living faction allies with >10 total damage — 10 per visible DoAfter.
- type: htnCompound
  id: HealAllyCompound
  branches:
    - preconditions:
        - !type:OwnedDefibPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickHealTargetOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:IllusionHealOperator
            corpsePrep: false
            duration: 2
            sound: !type:SoundPathSpecifier
              path: /Audio/Items/Medical/brutepack_begin.ogg
