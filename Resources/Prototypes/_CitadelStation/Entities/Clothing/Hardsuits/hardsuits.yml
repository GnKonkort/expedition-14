- type: entity
  parent: ClothingUniformBase
  id: ExperimentalLightEva
  name: Experimental light eva
  description: An enhanced eva suit, providing same protection as regular eva but with no additional .
  components:
  - type: Sprite
    sprite: _CitadelStation/Clothing/OuterClothing/Suits/experimentaleva.rsi
  - type: Clothing
    sprite: _CitadelStation/Clothing/OuterClothing/Suits/experimentaleva.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.7
    lowPressureMultiplier: 1000
  - type: Tag
