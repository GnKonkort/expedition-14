- type: entity
  parent: BaseWallmountMetallic
  id: ElectronicSignboard
  name: electronic signboard
  description: A programmable display. Paint frames, stamp text, dock up to three panels in a rectangle.
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _CitadelStation/Structures/Wallmounts/signboard.rsi
    snapCardinals: true
    layers:
    # Artwork under the bezel; scaled to sit in the transparent center so the frame never covers it.
    - state: screen
      map: [ "enum.SignboardVisualLayers.Artwork" ]
    - state: solo
      map: [ "enum.SignboardVisualLayers.Frame" ]
  - type: Appearance
  - type: Signboard
    neon: true
    powered: true
    playing: true
    frameStyleId: SignboardFrameChrome
  - type: ActivatableUI
    key: enum.SignboardUiKey.Key
    requiresComplex: true
  - type: UserInterface
    interfaces:
      enum.SignboardUiKey.Key:
        type: SignboardBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - SignboardNextFrame
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 400
  - type: Transform
    anchored: true
